name: Backend CI/CD (Go  ECR  EC2)

on:
  push:
    branches:
      - feature/full-stack
    paths:
      - "Server/**"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: starttech-backend
  IMAGE_TAG: latest

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        working-directory: Server/MuchToDo
        run: go test ./...

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: Server/MuchToDo
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Force ASG refresh (rolling deploy)
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name starttech-prod-asg \
            --preferences '{"MinHealthyPercentage": 50}'
