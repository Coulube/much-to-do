version: "3.8"
services:
  mongodb:
    image: mongo:6
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muchtodo-backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      MONGO_HOST: "mongodb"
      MONGO_PORT: "27017"
      MONGO_DB: "muchtodo"
      MONGO_URI: "mongodb://admin:password@mongodb:27017/muchtodo?authSource=admin"
      MONGO_USERNAME: "admin"
      MONGO_PASSWORD: "password"
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  mongodb_data:
