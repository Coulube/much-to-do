apiVersion: v1
kind: Pod
metadata:
  name: backend-envdump
  namespace: muchtodo
spec:
  restartPolicy: Never
  enableServiceLinks: false
  containers:
  - name: backend
    image: container-assessment-backend:latest
    imagePullPolicy: IfNotPresent
    command: ["sh","-c","echo '=== ENV DUMP ==='; env | sort; echo '=== END ==='"]
    env:
    - name: MONGO_URI
      value: mongodb://admin:password123@mongodb:27017/muchtodo?authSource=admin
    - name: MONGODB_URI
      value: mongodb://admin:password123@mongodb:27017/muchtodo?authSource=admin
    - name: MONGO_URL
      value: mongodb://admin:password123@mongodb:27017/muchtodo?authSource=admin
    - name: DATABASE_URL
      value: mongodb://admin:password123@mongodb:27017/muchtodo?authSource=admin
    envFrom:
    - configMapRef:
        name: backend-configmap
    - secretRef:
        name: backend-secret
