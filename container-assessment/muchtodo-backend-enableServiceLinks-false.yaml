apiVersion: apps/v1
kind: Deployment
metadata:
  name: muchtodo-backend
  namespace: muchtodo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: muchtodo-backend
  template:
    metadata:
      labels:
        app: muchtodo-backend
    spec:
      enableServiceLinks: false
      containers:
      - name: backend
        image: container-assessment-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: MONGO_URI
          value: mongodb://admin:password123@mongodb:27017/muchtodo?authSource=admin
        - name: MONGODB_URI
          value: mongodb://admin:password123@mongodb:27017/muchtodo?authSource=admin
        - name: MONGO_URL
          value: mongodb://admin:password123@mongodb:27017/muchtodo?authSource=admin
        - name: DATABASE_URL
          value: mongodb://admin:password123@mongodb:27017/muchtodo?authSource=admin
        envFrom:
        - configMapRef:
            name: backend-configmap
        - secretRef:
            name: backend-secret
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
